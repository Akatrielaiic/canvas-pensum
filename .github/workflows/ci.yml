name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      # Files shared verbatim with Canvas Arbor. A warning, not a failure: when a shared file
      # changes, one repository is always pushed before the other.
      - run: npm run check:shared
        continue-on-error: true
